[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "twistroute"
version = "0.1.0"
description = "Exact constrained sampling for masked diffusion language models: route-generic twisted SMC"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "scipy", "torch>=2.1"]

[project.optional-dependencies]
models = ["transformers>=4.40"]      # OWT-130M also needs flash-attn (see README)
test = ["pytest"]
bio = ["ViennaRNA>=2.6"]      # twistroute_bio.score.vienna

[tool.setuptools.packages.find]
include = ["twistroute*"]

[tool.pytest.ini_options]
# the test folders are on the path so that tests can import conftest and each other from any folder
pythonpath = [".", "tests", "tests/core", "tests/algorithms", "tests/legacy", "tests/experiments"]
testpaths = ["tests"]

# Style of the code that follows the notes (docs/refactor_map.md): one statement per line, at most
# 100 characters. The earlier packages are frozen and are not reformatted.
[tool.ruff]
line-length = 100
include = ["twistroute/state.py", "twistroute/sampler.py", "twistroute/resampling.py", "twistroute/twists/**/*.py",
           "twistroute/schedules/**/*.py", "twistroute/constraints/**/*.py", "twistroute/evaluation/**/*.py",
           "tests/core/test_sampler.py", "tests/core/test_core_matches_legacy.py", "tests/core/test_constraints_prop1.py",
           "tests/core/test_evaluation.py", "experiments/notes/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
